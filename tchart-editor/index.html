<!doctype html>
<!-- SPDX-License-Identifier: 0BSD -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tchart rust editor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div class="toolbar">
        <div class="toolbar-left">
          <button id="load" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z"/><path d="M11 9.5v3.5H9l3 3.5 3-3.5h-2V9.5z" fill="#fff"/></svg><span class="btn-label">Load</span></button>
          <button id="save-svg" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M5 3h12l4 4v14a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><text x="12" y="17.5" font-size="7.5" font-weight="700" font-family="sans-serif" text-anchor="middle" fill="#fff">SVG</text></svg><span class="btn-label">Save SVG</span></button>
          <button id="save-png" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M5 3h12l4 4v14a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><text x="12" y="17.5" font-size="7.5" font-weight="700" font-family="sans-serif" text-anchor="middle" fill="#fff">PNG</text></svg><span class="btn-label">Save PNG</span></button>
          <button id="save-wavedrom" type="button"><span class="btn-label">WaveDrom</span></button>
          <button id="help" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><text x="12" y="17" font-size="14" font-weight="700" font-family="serif" text-anchor="middle" fill="#fff">?</text></svg><span class="btn-label">Help</span></button>
        </div>
        <div class="toolbar-center">
          <span class="toolbar-logo">tchart rust editor</span>
          <span id="app-version" class="toolbar-version"></span>
        </div>
        <div class="toolbar-right">
          <span id="privacy-note" class="privacy-note"></span>
          <a id="github" class="toolbar-action" href="https://github.com/nodamushi/tchart-rust" target="_blank" rel="noopener noreferrer"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg><span class="btn-label">GitHub</span></a>
          <button id="license" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="3" rx="1.5"/><rect x="3" y="18" width="18" height="3" rx="1.5"/><rect x="4.5" y="6" width="15" height="12"/><rect x="7" y="9.5" width="10" height="1.2" fill="#fff"/><rect x="7" y="12.5" width="10" height="1.2" fill="#fff"/><rect x="7" y="15.5" width="6" height="1.2" fill="#fff"/></svg><span class="btn-label">License</span></button>
        </div>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
      <input type="file" id="file-input" accept=".tc,text/plain,.svg,image/svg+xml,.png,image/png" hidden />
      <div class="container">
        <div class="editor-pane">
          <code-input id="editor" language="tcml" template="tcml"></code-input>
        </div>
        <div class="preview-pane">
          <div id="preview"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
