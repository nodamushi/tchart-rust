name: Release tchart-cli

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: tchart
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: tchart.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}
          rustup default stable
          rustc --version
          cargo --version

      - name: Build tchart
        shell: bash
        run: |
          set -euo pipefail
          cargo build --profile cli-release --bin tchart --locked --target ${{ matrix.target }}

      - name: Stage artifact
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          name="tchart-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "stage/${name}"
          cp "target/${{ matrix.target }}/cli-release/${{ matrix.bin }}" "stage/${name}/"
          cp LICENSE README.md README.ja.md "stage/${name}/"
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -C stage -czf "dist/${name}.tar.gz" "${name}"
            archive_name="${name}.tar.gz"
          else
            (cd stage && 7z a -mx=9 "../dist/${name}.zip" "${name}" >/dev/null)
            archive_name="${name}.zip"
          fi
          (cd dist && sha256sum "${archive_name}" > "${archive_name}.sha256")
          echo "archive=dist/${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ steps.stage.outputs.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tchart-${{ matrix.target }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && cat *.sha256 > SHA256SUMS && rm -f *.sha256)
          cat dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
