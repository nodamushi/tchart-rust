<svg xmlns="http://www.w3.org/2000/svg" xmlns:tchart="http://tchart-rust/1.0" width="155.64" height="160.8" viewBox="0 0 155.64 160.8"><metadata><tchart:source>// @font 途中切替の波及範囲確認
// 仕様: docs/spec/tcml-format.md §ローカルパラメータ + §`@-&gt;` 行記述位置の font 適用
// テスト定義: docs/tests/cli-font.feature.md §`@font` 途中切替の波及範囲
//
// レンダリング後に SVG の font-family 属性を grep して確認する:
//   - Block A の信号名 / @title / @-&gt; ラベル → &quot;Comic Neue&quot;
//   - Block B の信号名 / @title / @-&gt; ラベル → &quot;Lobster Two&quot;
@step 8
@slant 2

// --- Block A: Comic Neue ---
@font &quot;Comic Neue&quot;

@title Block A title

ClockA  _~_~_~_~
DataA   =====@{a1}X====@{a2}

@-&gt; (@{a1}, @{a2}) arrow A

// --- Block B: Lobster Two ---
@font &quot;Lobster Two&quot;

@title Block B title

ClockB  _~_~_~_~
DataB   =====@{b1}X====@{b2}

@-&gt; (@{b1}, @{b2}) arrow B
