<svg xmlns="http://www.w3.org/2000/svg" xmlns:tchart="http://tchart-rust/1.0" width="274.526" height="492.4" viewBox="0 0 274.526 492.4"><metadata><tchart:source>// DC-Low / DC-High / DC-HiZ polygon 形状確認サンプル (#1 修正後)
// polygon は y_h~y_l 範囲、隣接遷移 (Pos / Neg / Pos-half / Neg-half / BusOpen / BusClose) を辺として取り込む。
// DC-HiZ は常に矩形 (隣接 slant に追従しない)。
// `?` を含む信号行でも slant は @slant どおりに維持される。
@fontsize 14
@step 18
@slant 6

@title &quot;DontCareAlong{Low,High,HiZ} polygon shapes&quot;

// DC-Low (内部水平線 y_l)
&quot;_?&quot;     _?
&quot;_?~&quot;    _?~~
&quot;~_?_~&quot;  ~~_?_~~
&quot;-_?-&quot;   --_?--
&quot;=_?=&quot;   ==_?==

// DC-High (内部水平線 y_h)
&quot;~?&quot;     ~?
&quot;~?_&quot;    ~?__
&quot;_~?~_&quot;  __~?~__
&quot;-~?-&quot;   --~?--

// DC-HiZ (内部水平線 y_mid、常に矩形)
&quot;-?&quot;     -?
&quot;-?-&quot;    -?-
&quot;_-?-_&quot;  __-?-__
&quot;~-?-~&quot;  ~~-?-~~
&quot;=-?-=&quot;  ==-?-==

// slant 維持の回帰確認
&quot;Bug Line&quot;     __?_~~~__?
&quot;Bug Bus2&quot;     ~~?~~===~?~
&quot;Normal Line&quot;  ___~~~__
