<svg xmlns="http://www.w3.org/2000/svg" xmlns:tchart="http://tchart-rust/1.0" width="236.86" height="224.4" viewBox="0 0 236.86 224.4"><metadata><tchart:source>// HiZ (`-`) 経由の遷移で実線 polyline が分断される確認サンプル (#2 修正後)
// 期待: `~~----___` で実線 polyline は `~~` と `___` の 2 本、
// HiZ 破線 polyline は `~-` slant + `----` hold + `-_` slant を 1 本にまとめる。
// 実線 polyline が HiZ 区間を貫通する余計な斜辺は出ない。
@fontsize 14
@step 12
@slant 4

@title &quot;HiZ polyline split&quot;

&quot;H-&gt;Z-&gt;L&quot;      ~~----___
&quot;L-&gt;Z-&gt;H&quot;      __----~~~
&quot;H-&gt;Z-&gt;H&quot;      ~~--~~
&quot;L-&gt;Z-&gt;L&quot;      __--__
&quot;multi&quot;        ~~--__--~~
&quot;1-cell HiZ&quot;   ~~-___
&quot;normal H-&gt;L&quot;  ~~~___
</tchart:source></metadata><style>.waveforms polyline { fill: none; stroke: black; }
