<svg xmlns="http://www.w3.org/2000/svg" xmlns:tchart="http://tchart-rust/1.0" width="236.668" height="234.4" viewBox="0 0 236.668 234.4"><metadata><tchart:source>// 不定値 (?) とハイライト ([]) と信号背景 (@bg) の目視確認用
// `@dontcare_color` を行の途中で切り替えることで、行ごとにハッチ色が変わることも確認する。
@fontsize 14
@step 10
@slant 2

// 不定値の連続と単独 (`?` は直前レベル必須 — `tcml-format.md` §`?` のエラー条件)
// まずデフォルト色 (#bbb)
NotCare1   _??======
NotCare2   _??_~~~~

// ハイライト区間
@highlight_style fill=&quot;#ff8&quot; stroke=&quot;none&quot;
Hi_Default  _~_~[_~_~]_~_~

@highlight_style fill=&quot;#8f8&quot; stroke=&quot;green&quot; stroke-width=&quot;0.8&quot;
Hi_Custom   ====[=====]====

// 不定値の色を赤に切り替え
@dontcare_color #c00
Hi_NotCare  ~~~~??____

// 信号背景 (@bg は次の信号にのみ適用)
@bg #e8f4e8
BgGreen     _~_~_~_~
@bg #f4e8e8
BgRed       =====X====

// 不定値の色を青に切り替え (デフォルト #bbb / 赤 #c00 / 青 #06c の 3 色を使う)
@dontcare_color #06c
NoBg        __??~~~~____
