<svg xmlns="http://www.w3.org/2000/svg" xmlns:tchart="http://tchart-rust/1.0" width="211.428" height="180.8" viewBox="0 0 211.428 180.8"><metadata><tchart:source>@step 10
@slant 2
@bgcolor0 #f8f8ff
@bgcolor1 #f0f0f0

Req     ___@{s}~~~~@{e}___
Ack     _______@{a}~~~~

@-&gt; (@{s}, @{a}) request
@-&gt; (@{e}, @{a}, dashed) ack

Bus     =====@1X====@2X====@3
Flag    ____@4~~~~@5___

@-&gt; (@1, @4, red, 2px) A
@-&gt; (@2, @5, blue, head=both) B
@-&gt; (@3, @4, green, dotted) forward ref

Data    __@{d1}~~~~@{d2}___
Out     ___@{o1}~~~~@{o2}__

@-&gt; (@{d1}, @{o1}, #ff8800, solid) start
@-&gt; (@{d2}, @{o2}, dashed, head=none) end
