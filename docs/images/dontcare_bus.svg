<svg xmlns="http://www.w3.org/2000/svg" xmlns:tchart="http://tchart-rust/1.0" width="274.353" height="251.2" viewBox="0 0 274.353 251.2"><metadata><tchart:source>// Bus 内 ? (`DontCareAlongBus`) の塗り形状確認サンプル
// 前後遷移に応じて左右辺が斜辺に追従
// `@dontcare_color` を行群ごとに書き換えることで、ハッチ色がその行以降で
// 切り替わることも目視確認する (デフォルト #bbb / 赤 / 青 / 緑 の 4 色)
@fontsize 14
@step 12
@slant 3

@title &quot;DontCareAlongBus shapes&quot;

// デフォルト色 (#bbb)
=?=         ====?====

@dontcare_color #c00
// 両側 Low: /=\ 形状 (赤)
_=?=_       ____====?====____

// 両側 High: \=/ 形状 (赤)
~=?=~       ~~~~====?====~~~~

@dontcare_color #06c
// 片側のみ Low (左斜辺、右垂直) (青)
_=?=        ____====?====

// 片側のみ Low (左垂直、右斜辺) (青)
=?=_        ====?====____

@dontcare_color #080
// 片側 High / 片側 Low (混在) (緑)
~=?=_       ~~~~====?====____

// HiZ 絡み: 左 HiZ、右 Bus continue (緑)
-=?=        ----====?====

// Bus + ラベル付き (緑)
=?=L        ====?====
</tchart:source></metadata><style>.waveforms polyline { fill: none; stroke: black; }
