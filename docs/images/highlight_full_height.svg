<svg xmlns="http://www.w3.org/2000/svg" xmlns:tchart="http://tchart-rust/1.0" width="244.595" height="294.8" viewBox="0 0 244.595 294.8"><metadata><tchart:source>// [] ハイライト と | Guide が Title 境界で止まることの目視確認用
// 仕様 (svg-rendering.md §HighlightStart/HighlightEnd, §Guide):
//   起点行から上下方向で最も近い Title まで縦断する。Title は貫通しない。
//   Title が無い側はチャート上端 / 下端から page_margin/2 はみ出す。
@fontsize 14
@step 10
@slant 2

// Title なしブロック (上端): Highlight/Guide はチャート上端まではみ出す
@highlight_style fill=&quot;#ff8&quot; stroke=&quot;orange&quot; stroke-width=&quot;0.5&quot;
Clock0    _~_~[_~_~]_~|_~
Data0     ======
Enable0   ____~~~~~~~~~~~~

@title &quot;Section A&quot;

// Title 区間内: 矩形は上方 Title の下端から始まる
@highlight_style fill=&quot;#8f8&quot; stroke=&quot;green&quot; stroke-width=&quot;0.5&quot;
RowA1     _~_~_~_~_~_~_~
RowA2     ====[========]====
RowA3     ~~~~________|~~~~

@title &quot;Section B&quot;

// 別 Title 区間: 矩形は上方 Title (Section B) の下端から始まり、下方 Title が
// 無いのでチャート下端まではみ出す
@highlight_style fill=&quot;#88f&quot; stroke=&quot;blue&quot; stroke-width=&quot;0.5&quot;
RowB1     ____[~~~~]____|
RowB2     =====X====
RowB3     _~_~_~_~_~_~_~_~
